name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cathaid_owner
          POSTGRES_PASSWORD: owner_dev_password
          POSTGRES_DB: cathaid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cathaid_owner -d cathaid"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://app_runtime:runtime_dev_password@localhost:5432/cathaid?connection_limit=10
      DIRECT_DATABASE_URL: postgresql://cathaid_owner:owner_dev_password@localhost:5432/cathaid
      REDIS_URL: redis://localhost:6379
      AUTH_JWT_SECRET: ci-secret-not-for-prod
      SHADOW_DATABASE_URL: postgresql://cathaid_owner:owner_dev_password@localhost:5432/cathaid_shadow

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Bootstrap app_runtime role (mirrors docker/postgres/init.sql)
        run: |
          PGPASSWORD=owner_dev_password psql -h localhost -U cathaid_owner -d cathaid \
            -f docker/postgres/init.sql
          PGPASSWORD=owner_dev_password psql -h localhost -U cathaid_owner -d cathaid \
            -c 'CREATE DATABASE cathaid_shadow'
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: RLS completeness gate
        run: npm run check-rls
      - name: Schema drift gate
        run: >-
          npx prisma migrate diff --exit-code
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
      - run: npx eslint "{src,test,scripts}/**/*.ts"
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
      - name: Tenant-tx spike (mechanism regression)
        run: npx tsx scripts/spike-tenant-tx.ts
